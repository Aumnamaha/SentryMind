name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sentrymind:
    name: SentryMind lint, type-check, security, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-cov pip-audit mypy bandit

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with black
        run: black --check .

      - name: Type check with mypy
        run: mypy agent/ memory/ config.py app.py --ignore-missing-imports

      - name: Security audit with pip-audit
        run: pip-audit --desc

      - name: Static security scan with Bandit
        run: bandit -r agent memory app.py config.py data -ll

      - name: Run tests with coverage
        run: python -m pytest tests/ -v --cov=agent --cov=memory --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentrymind-coverage
          path: coverage.xml

      - name: Run performance benchmark
        run: python tests/performance_benchmark.py
        continue-on-error: true

      - name: Verify no stack traces in API errors
        run: |
          python -c "
          import sys; sys.path.insert(0, 'webapp-backend')
          from main import app
          from fastapi.testclient import TestClient
          client = TestClient(app)
          r = client.get('/nonexistent')
          assert r.status_code == 404
          assert 'traceback' not in r.text.lower()
          assert 'File \"' not in r.text
          print('API error responses are safe (no stack traces)')
          "

  webapp-backend:
    name: Webapp Backend lint, type-check, security, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webapp-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-cov pip-audit mypy httpx

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with black
        run: black --check .

      - name: Type check with mypy
        run: mypy main.py --ignore-missing-imports

      - name: Security audit with pip-audit
        run: pip-audit --desc

      - name: Static security scan with Bandit
        run: bandit -r main.py -ll

      - name: Run tests with coverage
        run: |
          if [ -d tests ]; then
            python -m pytest tests/ -v --cov=main --cov-report=term-missing --cov-report=xml --cov-fail-under=90
          else
            echo "No tests found, skipping."
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webapp-backend-coverage
          path: coverage.xml

      - name: Verify API error responses are safe
        run: |
          python -c "
          from main import app
          from fastapi.testclient import TestClient
          client = TestClient(app)
          # Test 404
          r = client.get('/nonexistent')
          assert r.status_code == 404
          assert 'traceback' not in r.text.lower()
          assert 'File \"' not in r.text
          # Test 405
          r = client.post('/')
          assert r.status_code == 405
          assert 'traceback' not in r.text.lower()
          print('API error responses are safe (no stack traces)')
          "

  webapp-frontend:
    name: Webapp Frontend lint, format, security, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webapp-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: webapp-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with eslint
        run: npx eslint .

      - name: Format check with prettier
        run: npx prettier --check .

      - name: Security audit with npm
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
